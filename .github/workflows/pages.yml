# Builds the demo viewer with Vite and deploys it to GitHub Pages.
# Browsers cannot run demo/main.ts directly, so Pages must serve the bundle, not the repository.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build demo
        run: npm run build
      - name: Assemble site
        # The demo lives at /demo/ (the URL it always had); the site root redirects there.
        run: |
          mkdir -p _site/demo
          cp -r dist/. _site/demo/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <title>Scope &amp; Drop</title>
          <meta http-equiv="refresh" content="0; url=demo/" />
          <link rel="canonical" href="demo/" />
          <a href="demo/">Open the mansion demo</a>
          HTML
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}demo/
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
