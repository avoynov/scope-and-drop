<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reticle Lab</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --ink: #e9e4d8;
        --muted: #9a9486;
        --line: rgba(233, 228, 216, 0.14);
        --panel: rgba(10, 11, 15, 0.62);
        --accent: #e0b56a;
      }
      html, body { margin: 0; height: 100%; background: #07080c; color: var(--ink); font: 12px/1.45 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; overflow: hidden; }
      canvas { display: block; touch-action: none; cursor: crosshair; }
      #hud { position: fixed; left: 16px; bottom: 16px; width: 280px; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); overflow: auto; background: var(--panel); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; box-sizing: border-box; }
      #hud h1 { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 600; margin: 0 0 10px; color: var(--accent); display: flex; justify-content: space-between; }
      #hud h1 a { color: var(--muted); text-decoration: none; letter-spacing: 0.08em; }
      .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
      .seg.one { grid-template-columns: 1fr; }
      .seg.three { grid-template-columns: 1fr 1fr 1fr; }
      .seg.three button { padding: 6px 2px; }
      .flags { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 6px; margin: 4px 0 10px; }
      button { font: inherit; color: var(--ink); background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; cursor: pointer; }
      button.on { border-color: var(--accent); color: var(--accent); background: rgba(224, 181, 106, 0.08); }
      label { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; color: var(--muted); margin-bottom: 4px; }
      input[type='range'] { width: 100%; margin: 0; accent-color: var(--accent); }
      dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; margin: 8px 0 0; border-top: 1px solid var(--line); padding-top: 8px; }
      dt { color: var(--muted); }
      dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
      .hint { color: var(--muted); margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
      body.nohud #hud { display: none; }
      /* Ammo and wind cards: what the shooter knows about the round and the wind. Part of the sight picture, so H keeps them. */
      #cards { position: fixed; top: 16px; right: 16px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
      .card { background: var(--panel); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px 8px; font-variant-numeric: tabular-nums; }
      .card[hidden] { display: none; }
      .card .dope-head { display: flex; gap: 6px; align-items: baseline; color: var(--muted); margin-bottom: 6px; }
      .card .dope-head b { color: var(--accent); font-weight: 600; letter-spacing: 0.08em; }
      .card .dope-head span { margin-left: auto; padding-left: 14px; }
      .card table { border-collapse: collapse; }
      .card th { color: var(--muted); font-weight: 400; text-align: left; padding: 1px 10px 1px 0; }
      .card td { text-align: right; padding: 1px 0 1px 12px; }
      .card tr:first-child td { color: var(--muted); }
      #windcard td { text-align: center; padding-left: 10px; min-width: 22px; }
      #windcard tr.card-sub td { color: var(--muted); }
      #windcard svg { display: block; margin: 0 auto 2px; color: var(--muted); }
      .card-note { color: var(--muted); margin-top: 6px; max-width: 220px; }
      /* Wound card: what the last hit on a mannequin would have done to a person. */
      #wound { position: fixed; bottom: 16px; right: 16px; width: 252px; max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box; background: var(--panel); backdrop-filter: blur(14px); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px 10px; }
      #wound[hidden], body.nohud #wound { display: none; }
      #wound .wound-head { display: flex; align-items: baseline; gap: 8px; }
      #wound .wound-head b { letter-spacing: 0.14em; font-weight: 700; }
      #wound .wound-head b.killed { color: #ff5a4d; }
      #wound .wound-head b.downed { color: var(--accent); }
      #wound .wound-head b.wounded { color: #9fc79a; }
      #wound .wound-head span { margin-left: auto; color: var(--muted); }
      #wound .wound-cause { margin: 3px 0 2px; }
      #wound dl { margin-top: 6px; padding-top: 6px; }
      #wound dd { max-width: 150px; }
      #wound svg { display: block; margin: 8px auto 0; }
      @media (max-width: 640px) {
        #wound { top: auto; bottom: calc(46vh + 24px); left: 16px; right: 16px; width: auto; font-size: 11px; }
        #wound svg { display: none; }
        #hud { left: 16px; right: 16px; width: auto; bottom: 16px; max-height: 46vh; }
        .hint { display: none; }
        #cards { left: 16px; right: 16px; align-items: stretch; font-size: 11px; }
        .card td { padding-left: 8px; }
        .card-note { max-width: none; }
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="cards"><div id="dope" class="card" hidden></div><div id="windcard" class="card"></div></div>
    <div id="wound" hidden><div id="wound-text"></div><div id="wound-svg"></div></div>
    <div id="hud">
      <h1><span>Reticle Lab</span><a href="../">mansion ↗</a></h1>
      <div class="seg three">
        <button data-ret="pso" title="SVD, 7N1, PSO-1 reticle cut for the round">SVD · PSO</button>
        <button data-ret="tree" title="Bolt rifle, M118LR, mil tree with an ammo card">MIL TREE</button>
        <button data-ret="vss" title="VSS, 9×39 SP-5 subsonic, PSO-1-1 reticle cut for the round: the game's rifle">VSS · PSO</button>
      </div>
      <label>Power<input id="mag" type="range" min="4" max="20" step="0.1" /></label>
      <label>Parallax<input id="par" type="range" min="0" max="105" step="0.5" /></label>
      <label>Eye ↔<input id="ex" type="range" min="-6" max="6" step="0.1" /></label>
      <label>Eye ↕<input id="ey" type="range" min="-6" max="6" step="0.1" /></label>
      <label>Eye relief<input id="ez" type="range" min="-30" max="40" step="0.5" /></label>
      <label>Pan shadow<input id="pan" type="range" min="0" max="2" step="0.05" /></label>
      <label>Wind m/s<input id="wind" type="range" min="0" max="10" step="0.5" /></label>
      <label>Wind from<input id="winddir" type="range" min="0.5" max="12" step="0.5" title="clock: 12 from downrange, 3 from the right, 9 from the left" /></label>
      <div class="seg">
        <button id="glass" title="A glazed window frame 4 m in front of each mannequin: off, single 4 mm, double 4-16-4, laminated 6.8 mm, tempered 6 mm">Glass · off</button>
        <button id="pane" title="Glaze the frames again">New pane</button>
      </div>
      <label>Pane angle<input id="glassangle" type="range" min="-60" max="60" step="5" title="degrees from square-on: + turns the pane's face to your right" /></label>
      <div class="flags">
        <button data-flag="illum">Illum</button>
        <button data-flag="sway">Sway</button>
        <button data-flag="mirage">Mirage</button>
        <button data-flag="drift">Head</button>
        <button data-flag="sound">Sound</button>
        <button data-flag="easy" title="Easy: a wind meter on a mast at the hide reads the wind at the flags' height">Easy</button>
      </div>
      <div class="seg">
        <button id="center">Centre eye</button>
        <button id="fire">Fire · Space</button>
      </div>
      <div class="seg one"><button id="scope">Scope out · F</button></div>
      <dl id="readout"></dl>
      <div class="hint">Drag to aim · wheel/pinch zoom · F or right-click scope in/out · Space fire (works the bolt, changes magazines) · WASD head · Q/E eye relief · head up: drag or scroll the drum on the scope, [ ] click it · R rifle · G glass · L illum · H hide</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
